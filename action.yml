name: Deploy Github Pages
inputs:
  path:
    description: The path to deploy
    required: true
runs:
  using: composite
  steps:
    - name: Setup Pages
      uses: actions/configure-pages@v5
    - name: Upload artifact
      uses: actions/upload-pages-artifact@v4
      with:
        path: ${{ inputs.path }}
    - name: Deploy to GitHub Pages
      uses: actions/deploy-pages@v4
